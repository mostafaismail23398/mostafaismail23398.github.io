<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mostafa Ismail Ahmed — DevOps Engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
  <div class="container nav-inner">
    <span class="nav-brand" id="nav-brand">Portfolio</span>

    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="navMenu">
      <span></span><span></span><span></span>
    </button>

    <ul id="navMenu">
      <li><a href="#about">About</a></li>
      <li><a href="#experience">Experience</a></li>
      <li><a href="#skills">Skills</a></li>
      <li><a href="#projects">Projects</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </div>
</nav>

<header class="hero">
  <div class="container">
    <div class="hero-grid">
      <div>
        <p class="kicker" id="hero-kicker"><span class="dot"></span></p>
        <h1 id="hero-headline"></h1>
        <p class="hero-sub" id="hero-tagline"></p>
        <div class="hero-cta">
          <a href="#projects" class="btn btn-primary" id="cta-primary"></a>
          <a href="#contact" class="btn btn-ghost" id="cta-secondary"></a>
        </div>
      </div>

      <div class="diagram-wrap">
        <svg class="diagram" viewBox="0 0 760 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Infrastructure diagram connecting AWS, Docker, Kubernetes, Terraform, Ansible, and Prometheus to a central hub">
          <g id="edges"></g>
          <g id="pulses"></g>
          <circle class="hub-circle" cx="380" cy="110" r="30"/>
          <text class="hub-label" x="380" y="107" text-anchor="middle">UPTIME</text>
          <text class="hub-label" x="380" y="120" text-anchor="middle">99.9%</text>
          <g id="nodes"></g>
        </svg>
      </div>

      <div class="stats" id="stats"></div>
    </div>
  </div>
</header>

<section id="about">
  <div class="container fade">
    <p class="eyebrow">About</p>
    <h2 id="about-heading"></h2>
    <p class="about-body" id="about-body"></p>
  </div>
</section>

<section id="experience">
  <div class="container fade">
    <p class="eyebrow">Experience</p>
    <h2>Where I've worked</h2>
    <div class="timeline" id="timeline"></div>
  </div>
</section>

<section id="skills">
  <div class="container fade">
    <p class="eyebrow">Skills</p>
    <h2>What I work with</h2>
    <div id="skills-wrap"></div>
  </div>
</section>

<section id="projects">
  <div class="container fade">
    <p class="eyebrow">Projects</p>
    <h2>Selected work</h2>

    <div class="proj-tabs">
      <button class="proj-tab active" data-filter="all">All</button>
      <button class="proj-tab" data-filter="upwork">Upwork</button>
      <button class="proj-tab" data-filter="work">Employment</button>
    </div>

    <div class="proj-grid" id="proj-grid"></div>
  </div>
</section>

<section id="edu-lang">
  <div class="container fade">
    <div class="grid-2">
      <div class="info-block">
        <h3>Education</h3>
        <p id="edu-degree"></p>
        <p id="edu-school"></p>
        <p id="edu-note"></p>
      </div>
      <div class="info-block">
        <h3>Languages</h3>
        <div id="lang-list"></div>
      </div>
    </div>
  </div>
</section>

<section id="contact">
  <div class="container fade">
    <div class="contact-card">
      <p class="eyebrow" style="color:var(--amber)">Contact</p>
      <h2 id="contact-heading"></h2>
      <p id="contact-body"></p>
      <div class="contact-links" id="contact-links"></div>
    </div>
  </div>
</section>

<footer>© <span id="year"></span> <span id="footer-name"></span></footer>

<script src="js/main.js"></script>
</body>
</html>
